name: PATENT MAP Enterprise Test Dashboard & CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test_execution_dashboard:
    name: Run 300-Selenium, 300-API, Load & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Test Suite Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: ⚡ Execute 300-Selenium, 300-API, Load & Security Suite
        run: |
          python tests_300/run_all_tests.py

      - name: 📝 Output Summary.md to GitHub Actions Step Summary
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: 📊 Upload Excel & Summary.md Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PATENT-MAP-Test-Results-Artifacts
          path: |
            test_results_dashboard.xlsx
            summary.md
          retention-days: 30
